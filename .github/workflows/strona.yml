# Buduje mapę z plików w repozytorium i wystawia ją na GitHub Pages.
name: strona

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  buduj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python zbuduj.py
          mkdir -p _site
          cp infra-podglad.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publikuj:
    needs: buduj
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
